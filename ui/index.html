<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!--
    Политика проверена spike-стендом (spike/README.md): нарушений не было ни на file://,
    ни на собственном scheme. Что здесь обязательно и почему:
      style-src 'unsafe-inline' — Monaco сам создаёт <style>-элементы и nonce им не проставляет.
                                   Единственное вынужденное ослабление; script-src остаётся строгим.
      font-src  data:             — шрифт codicon в min-сборке Monaco инлайнится как data:font/ttf.
      img-src   data: blob:       — в CSS Monaco есть data:image/png и data:image/svg+xml.
      worker-src 'self' blob:     — 'self' для наших воркеров, blob: для штатного пути Monaco.
      connect-src 'self'          — на случай обращения AMD-загрузчика за nls-сообщениями.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whale Bridge</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Стили xterm.js (этап C3). Подключает их сам ui/terminal.js при первом открытии
       терминала: путь живёт в node_modules, а в тестовом окружении файла нет —
       статичный <link> давал бы постоянный 404 в консоли. -->
  <link rel="stylesheet" id="xterm-css">
</head>
<body>
  <!-- Раскладка (итог ручной проверки этапа B):
       .app       — строки: topbar / workspace
       .workspace — колонки: .ide / разделитель / #chat-slot. Чат ВСЕГДА справа:
                    перенос стороны ломал рендер нативного слоя, переключатель удалён.
       .ide       — колонки: левая панель / разделитель / редактор.
       Левая панель — вкладки «Файлы / Предложения / История»: дерево проекта,
       список предложений и журнал операций живут в одной колонке и переключаются.
       Панель редактора показывает одно из четырёх: вкладки+код (Monaco), просмотр
       предложения/истории (#view-host), «Промпт» (#prompt-host) или пустое состояние.
       Геометрией владеет renderer (§4, §28): main получает только прямоугольник #chat-slot. -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Whale Bridge">🐋 Whale Bridge</div>
      <!-- содержимое рисует ui/app.js: чат, проект, подсказки, «Промпт» и «Напомнить формат» -->
      <div id="head"></div>
    </header>

    <main class="workspace" id="workspace">
      <div class="ide" id="ide">
        <section class="left-panel" aria-label="Файлы, предложения, история">
          <!-- вкладки левой панели рисует ui/app.js -->
          <nav id="left-tabs" class="left-tabs"></nav>
          <!-- Файлы: заголовок и плашку расхождений рисует ui/app.js, дерево — ui/editor.js -->
          <div id="files-pane" class="files-pane">
            <div id="files-head" class="files-head"></div>
            <div id="files-banner"></div>
            <div id="ed-tree" class="ed-tree"></div>
          </div>
          <!-- Предложения / История: списки и журналы -->
          <div id="body" class="left-body hidden"></div>
        </section>
        <div class="vsplit" id="vsplit-left" title="Ширина левой панели" role="separator" aria-orientation="vertical"></div>

        <section class="editor-panel" aria-label="Редактор">
          <!-- .ed-content — всё, что занимает место редактора (режимы панели), вместе
               с оверлеями и тостом. Терминал (§2.1) живёт НИЖЕ, внутри .editor-panel:
               он виден в любом режиме панели и никогда не наезжает на чат — чат
               занимает свою колонку на полную высоту. -->
          <div class="ed-content" id="ed-content">
          <div id="ed-tabs" class="ed-tabs"></div>
          <!-- Monaco создаётся один раз и живёт в #ed-host постоянно (§7): режимы панели
               переключаются классом hidden, DOM-контейнер редактора не пересоздаётся. -->
          <div id="ed-host" class="ed-host hidden"></div>
          <!-- ячейка Monaco DiffEditor (этап C): просмотр предложения / «моих правок» /
               операции истории занимает место редактора. #diff-bar рисует ui/app.js
               (заголовок, бейджи, действия), в #diff-editor живёт экземпляр DiffEditor
               из ui/editor.js — он создаётся один раз и переживает перерисовки (§7). -->
          <div id="diff-host" class="diff-host hidden">
            <div id="diff-bar" class="diff-bar"></div>
            <!-- предупреждения (неполный ответ, блоки правки, база) — полоской над диффом;
                 отдельного режима «Подробности» больше нет: он дублировал дифф -->
            <div id="diff-notices" class="diff-notices"></div>
            <!-- список ханков с чекбоксами (§20): выбор пересчитывает предпросмотр -->
            <div id="hunk-strip" class="hunk-strip hidden"></div>
            <div id="diff-editor" class="diff-editor"></div>
          </div>
          <!-- просмотр предложения / операции истории / «моих правок» / конфликта merge -->
          <div id="view-host" class="view-host hidden"></div>
          <!-- конструктор промптов: открывается вместо редактора кнопкой в topbar -->
          <div id="prompt-host" class="prompt-host hidden">
            <div class="prompt-head">
              <span class="panel-title">ПРОМПТ</span>
              <span class="grow"></span>
              <button class="btn ghost tiny" id="prompt-close" type="button" title="Закрыть и вернуться к редактору">✕</button>
            </div>
            <div id="prompt-body" class="prompt-body"></div>
          </div>
          <!-- настройки (этап C3b, §2.4): тот же приём, что у «Промпта» — режим центральной
               панели вместо редактора. Содержимое рисует ui/app.js по данным
               src/runsettings.js (таблица языков) и tools:detect (что найдено в PATH).
               Режим не сохраняется в layout: настройки — утилита, а не рабочее окно,
               и после перезапуска приложение обязано открываться как раньше. -->
          <div id="settings-host" class="settings-host hidden">
            <div class="prompt-head">
              <span class="panel-title">НАСТРОЙКИ</span>
              <span class="section-note">Запуск</span>
              <span class="grow"></span>
              <button class="btn ghost tiny" id="settings-close" type="button" title="Закрыть и вернуться к редактору">✕</button>
            </div>
            <div id="settings-body" class="settings-body"></div>
          </div>
          <div id="ed-empty" class="ed-empty">
            <div>Файл не открыт.</div>
            <div class="path">Выберите файл в дереве слева или нажмите Ctrl+P.</div>
          </div>
          <div id="ed-status" class="ed-status"></div>

          <!-- Оверлеи и тосты — только внутри области редактора: WebContentsView с
               DeepSeek перекрывает любые CSS-слои, поверх чата не нарисуется ничего
               (§24). Внутри .ed-content они к тому же не перекрывают терминал. -->
          <div id="ed-overlay" class="ed-overlay hidden"></div>
          <div id="toast" role="status" aria-live="polite"></div>
          </div><!-- /.ed-content -->

          <!-- Терминал (этап C3, §2.1): нижняя панель внутри колонки редактора.
               Независима от режимов центральной панели — видна и когда открыт код,
               и когда открыт просмотр/diff/«Промпт». Высота перетаскивается
               (#hsplit-term) и сохраняется в layout (termH). -->
          <div class="hsplit" id="hsplit-term" title="Высота терминала" role="separator" aria-orientation="horizontal"></div>
          <div id="term-panel" class="term-panel hidden">
            <!-- toolbar (состояние и кнопки ▶ ■ ↻ 📋 🗑 ✕) рисует ui/app.js -->
            <div id="term-bar" class="term-bar"></div>
            <!-- xterm создаётся один раз и переживает перерисовки (§7, как Monaco) -->
            <div id="term-host" class="term-host"></div>
          </div>
        </section>
      </div>
      <div class="vsplit" id="vsplit-chat" title="Ширина чата" role="separator" aria-orientation="vertical"></div>

      <!-- Пустой контейнер: задаёт геометрию, которую ResizeObserver отправляет в main
           (chat:set-bounds), и main физически кладёт сюда WebContentsView с DeepSeek. -->
      <div id="chat-slot"></div>
    </main>
  </div>

  <!-- Порядок важен: каждый следующий модуль использует предыдущий.
       src/versions.js и src/context.js общие для main и renderer: правила классификации
       версий и правило расхождения контекста должны быть в одном экземпляре, иначе
       main и интерфейс начнут расходиться в том, знает ли модель файл.
       ui/layout.js — та же UMD-схема: математика раскладки общая для renderer и main. -->
  <script src="../src/versions.js"></script>
  <script src="../src/context.js"></script>
  <!-- diff и ханки общие для main и renderer: авторитетный дифф — src/diff.js,
       математика принятия ханков — src/hunks.js (UMD, window.WhaleDiff/WhaleHunks) -->
  <script src="../src/diff.js"></script>
  <script src="../src/hunks.js"></script>
  <!-- runlangs общий для main и renderer (UMD): классификатор опасных команд и
       таблица языков обязаны быть одним правилом на два процесса (ТЗ C3 §3.1) -->
  <script src="../src/runlangs.js"></script>
  <!-- модель представления настроек запуска (этап C3b): строки таблицы, статусы,
       правило изменения config.run — те же данные, что использует main -->
  <script src="../src/runsettings.js"></script>
  <script src="dom.js"></script>
  <script src="layout.js"></script>
  <script src="editor-state.js"></script>
  <script src="languages/gdscript.js"></script>
  <script src="monaco.js"></script>
  <script src="editor.js"></script>
  <!-- xterm.js грузится локально из node_modules (CSP не меняется: script-src 'self').
       В packaged-сборке node_modules остаётся внутри asar — в отличие от Monaco,
       которому нужен распакованный путь для воркеров, xterm — обычный скрипт без
       воркеров, и относительный путь работает в обоих случаях. -->
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <!-- терминал до app.js: app.js использует window.WhaleTerminal при монтаже -->
  <script src="terminal.js"></script>
  <script src="app.js"></script>
</body>
</html>
